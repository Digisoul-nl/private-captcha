<script defer src="https://cdn.privatecaptcha.com/widget/js/privatecaptcha.js"></script>
<script>
    // Two widget modes are supported, distinguished by the rendered
    // data-start-mode attribute:
    //
    // - "auto" (hidden/default widgets): the puzzle solves itself in the
    //   background and writes its solution into the form asynchronously.
    //   Submitting before that finishes would POST an empty
    //   `private_captcha_solution`, so we block the submit, kick off
    //   execute(), and poll for the solution (with a safety timeout) before
    //   letting the form go.
    // - "click" (display="widget"): the visitor must tick the checkbox
    //   themselves before a solution exists. There is nothing to execute()
    //   here — if the solution is missing we just block the submit and point
    //   the visitor at the widget.
    document.addEventListener("DOMContentLoaded", () => {
        const SOLUTION_FIELD = "private_captcha_solution";
        const MAX_WAIT_MS = 8000;
        const POLL_INTERVAL_MS = 150;

        const solutionValue = (form) => {
            const fields = form.querySelectorAll(`[name="${SOLUTION_FIELD}"]`);
            // The widget injects its own hidden input in addition to the template's
            // empty one; take the last non-empty value (that's the real solution).
            for (let i = fields.length - 1; i >= 0; i--) {
                if (fields[i].value) return fields[i].value;
            }
            return "";
        };

        document.querySelectorAll("form").forEach((form) => {
            const widget = form.querySelector(".private-captcha");
            if (!widget) return;

            const hint = form.querySelector("[data-captcha-hint]");
            const clickToSolve = widget.dataset.startMode === "click";
            let releasing = false;

            form.addEventListener("submit", (event) => {
                if (releasing || solutionValue(form)) {
                    if (hint) hint.style.display = "none";
                    sessionStorage.setItem("restoreScroll", window.scrollY);
                    return;
                }

                event.preventDefault();

                if (clickToSolve) {
                    if (hint) hint.style.display = "";
                    widget.scrollIntoView({ block: "center", behavior: "smooth" });
                    return;
                }

                try {
                    window.privateCaptcha?.autoWidget?.execute();
                } catch (e) {
                    /* widget not ready; the poll below will time out and submit */
                }

                const startedAt = Date.now();
                const timer = setInterval(() => {
                    const ready = solutionValue(form);
                    if (ready || Date.now() - startedAt > MAX_WAIT_MS) {
                        clearInterval(timer);
                        releasing = true;
                        sessionStorage.setItem("restoreScroll", window.scrollY);
                        if (typeof form.requestSubmit === "function") {
                            form.requestSubmit();
                        } else {
                            form.submit();
                        }
                    }
                }, POLL_INTERVAL_MS);
            });
        });

        const savedScroll = sessionStorage.getItem("restoreScroll");
        if (savedScroll !== null) {
            window.scrollTo(0, parseInt(savedScroll, 10));
            sessionStorage.removeItem("restoreScroll");
        }
    });
</script>
