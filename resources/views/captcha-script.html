<script defer src="https://cdn.privatecaptcha.com/widget/js/privatecaptcha.js"></script>
<script>
    // Two widget modes are supported, distinguished by the rendered
    // data-start-mode attribute:
    //
    // - "auto" (display="hidden" and "popup"): the puzzle solves itself in the
    //   background and writes its solution into the form asynchronously.
    //   Submitting before that finishes would POST an empty
    //   `private_captcha_solution`, so we block the submit, kick off
    //   execute(), and poll for the solution (with a safety timeout) before
    //   letting the form go.
    // - "click" (display="widget", the default): the visitor must tick the
    //   checkbox themselves before solving starts. Nothing to execute() here.
    //   Ticking the box fires `privatecaptcha:checked` immediately, but the
    //   proof-of-work still runs for a second or so afterwards — so a submit
    //   that arrives in between waits for the solution just like auto mode,
    //   and only a submit from a visitor who never ticked gets the hint.
    document.addEventListener("DOMContentLoaded", () => {
        const SOLUTION_FIELD = "private_captcha_solution";
        // An automatic widget starts solving on page load or first focus, so by
        // the time the visitor submits it has had a long head start and 8s is
        // plenty. A click widget only starts when the box is ticked, which may
        // be moments before the submit — the whole proof-of-work then has to
        // fit inside this budget, and on a low-end phone that takes a while.
        // Time out too early and we POST an empty solution, which the server
        // rejects as "Invalid Captcha." for a visitor who did nothing wrong.
        const AUTO_MAX_WAIT_MS = 8000;
        const CLICK_MAX_WAIT_MS = 30000;
        const POLL_INTERVAL_MS = 150;

        const solutionValue = (form) => {
            const fields = form.querySelectorAll(`[name="${SOLUTION_FIELD}"]`);
            // The widget injects its own hidden input in addition to the template's
            // empty one; take the last non-empty value (that's the real solution).
            for (let i = fields.length - 1; i >= 0; i--) {
                if (fields[i].value) return fields[i].value;
            }
            return "";
        };

        document.querySelectorAll("form").forEach((form) => {
            const widget = form.querySelector(".private-captcha");
            if (!widget) return;

            const hint = form.querySelector("[data-captcha-hint]");
            const clickToSolve = widget.dataset.startMode === "click";
            const maxWaitMs = clickToSolve ? CLICK_MAX_WAIT_MS : AUTO_MAX_WAIT_MS;
            let releasing = false;
            let waiting = false;
            let userStarted = false;
            let failed = false;

            // `checked` fires the moment the visitor ticks the box, `start` once
            // the proof-of-work actually begins — both well before the solution
            // exists. We listen for either: `checked` is dispatched by the
            // widget's internals and is not part of the documented API, so
            // `start` is the fallback if a future widget release drops it.
            ["privatecaptcha:checked", "privatecaptcha:start"].forEach((name) => {
                widget.addEventListener(name, () => {
                    userStarted = true;
                    if (hint) hint.hidden = true;
                });
            });

            // The widget gave up (network, worker error). No solution is coming,
            // so stop holding the form hostage for the rest of the budget and
            // let the server reject it with its own message.
            widget.addEventListener("privatecaptcha:error", () => {
                failed = true;
            });

            // Hold the POST until the solution field is populated (with a safety
            // timeout), then let the native submission through.
            const releaseWhenSolved = () => {
                if (waiting) return;
                waiting = true;

                const startedAt = Date.now();
                const timer = setInterval(() => {
                    const ready = solutionValue(form);
                    if (ready || failed || Date.now() - startedAt > maxWaitMs) {
                        clearInterval(timer);
                        releasing = true;
                        sessionStorage.setItem("restoreScroll", window.scrollY);
                        if (typeof form.requestSubmit === "function") {
                            form.requestSubmit();
                        } else {
                            form.submit();
                        }
                    }
                }, POLL_INTERVAL_MS);
            };

            form.addEventListener("submit", (event) => {
                if (releasing || solutionValue(form)) {
                    if (hint) hint.hidden = true;
                    sessionStorage.setItem("restoreScroll", window.scrollY);
                    return;
                }

                event.preventDefault();

                if (clickToSolve) {
                    // Never ticked: no solution is coming, so ask the visitor.
                    if (!userStarted) {
                        if (hint) hint.hidden = false;
                        widget.scrollIntoView({ block: "center", behavior: "smooth" });
                        return;
                    }

                    // Ticked, still solving: wait it out instead of nagging.
                    releaseWhenSolved();
                    return;
                }

                try {
                    window.privateCaptcha?.autoWidget?.execute();
                } catch (e) {
                    /* widget not ready; the poll below will time out and submit */
                }

                releaseWhenSolved();
            });
        });

        const savedScroll = sessionStorage.getItem("restoreScroll");
        if (savedScroll !== null) {
            window.scrollTo(0, parseInt(savedScroll, 10));
            sessionStorage.removeItem("restoreScroll");
        }
    });
</script>
