<input type="hidden" name="private_captcha_solution" value="">

<div>
    <div class="private-captcha"
         data-start-mode="{{ start_mode }}"
         data-display-mode="{{ display }}"
         data-solution-field="private_captcha_solution"
         data-sitekey="{{ sitekey }}"></div>

    <p hidden role="alert" style="color: #dc2626; font-size: 0.875rem; margin-top: 0.5rem;" data-captcha-hint>{{ trans key="Please confirm you are not a robot." }}</p>
    <p hidden role="alert" style="color: #dc2626; font-size: 0.875rem; margin-top: 0.5rem;" data-captcha-error>{{ trans key="Verification is unavailable right now. Please reload the page and try again." }}</p>
</div>
